parameters:
  - name: pool_name
    displayName: agent pool location
    type: string
    default: default

resources:
 repositories:
   - repository: templates
     name: 'proy_ing/pipeline_templates'
     type: git
     ref: refs/heads/feature/devops


trigger:
  branches:
    include:
     - 13.0
  paths:
    include:
      - sale_commission/*
      - hr_commission/*
      - sale_commission_salesman/*

pool:
  name: 'default'


extends:
  template: templates/azure-pipeline-odooapp.yml@templates
  parameters:
    sonarqube_project_key: '$(sonarqube_project_key)'
    sonarqube_project_name: 'odoo_oca_commission'
    serviceConnection: '$(service_conection)'
    sonarUrl: $(sonar_url)
    filter_version: "^13.0.[0-9\\.]+$"
    pool_name: ${{parameters.pool_name}}
    strategy_matrix:
      - name: Proyecto1
        value: 'sale_commission'
      - name: Proyecto2
        value: 'hr_commission'
      - name: Proyecto3
        value: 'sale_commission_salesman'